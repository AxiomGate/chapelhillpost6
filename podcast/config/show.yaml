# BASE DEFAULTS — deliberately unbranded.
#
# This file is the substrate every client sits on. It carries engineering
# defaults only: model choices, GPU assignment, loudness targets, encoder
# settings. It must never contain a client's name, domain, voice, colours,
# subject matter or editorial voice.
#
# Per-client settings live in clients/<name>/show.yaml and are deep-merged over
# this file, so a client profile only states what differs. See clients/example/.
#
# Run a specific client with:
#   podcastpipe --client acme research
#   PODCASTPIPE_CLIENT=acme podcastpipe research

show:
  name: "Untitled Show"
  tagline: ""
  host: "Host"
  author_email: "${SHOW_EMAIL}"
  language: "en-us"
  timezone: "America/New_York"
  target_minutes: 18

  # Intentionally empty. A client with no style guide gets a generic script,
  # which is the correct failure mode — better than inheriting another client's
  # editorial voice.
  style_guide: ""

  # Four segments is a sustainable daily load. Clients override this wholesale.
  segments:
    - id: cold_open
      name: "Cold Open"
      target_seconds: 25
      instructions: "One or two sentences on the single biggest thing today. No greeting yet."
    - id: headlines
      name: "Headlines"
      target_seconds: 240
      instructions: "Greeting, date, then three to five items at 30-45 seconds each."
    - id: deep_dive
      name: "The Story"
      target_seconds: 480
      instructions: "The lead story with real context. What happened, what it means, what comes next."
    - id: outro
      name: "Outro"
      target_seconds: 40
      instructions: "Thanks, where to find the show, and one line teasing tomorrow."

# Terms the TTS mispronounces. Client profiles add their own; this base holds
# only genuinely universal ones.
pronunciations: {}

block_gap_seconds: 0.4

gpu:
  # Single-machine fallback. In cluster mode (config/cluster.yaml) each worker
  # gets its own card and these are ignored.
  avatar: 0
  tts: 1
  llm: 1
  whisper: 2
  encode: 2

llm:
  provider: anthropic          # anthropic | local
  model: claude-sonnet-5
  local_base_url: "http://localhost:8000/v1"
  local_model: "Qwen/Qwen3-32B-AWQ"
  max_tokens: 8000
  # Local provider only. Anthropic removed temperature/top_p/top_k on Sonnet 5,
  # Opus 5, Opus 4.7/4.8 and Fable 5 -- sending one is a 400 -- so the Anthropic
  # path ignores this and steers by prompt instead.
  temperature: 0.3

tts:
  engine: chatterbox           # chatterbox | vibevoice
  venv: "~/envs/chatterbox"
  # Resolved against the client directory first, then the repo root, so each
  # client's voice reference lives with that client and never leaks across.
  reference_audio: "assets/voice/reference.wav"
  max_chars_per_chunk: 300
  crossfade_ms: 40
  seed: 1234
  exaggeration: 0.45           # 0.3 calm, 0.5 default, 0.7+ animated
  cfg_weight: 0.5              # lower tracks the reference more closely
  sample_rate: 24000

avatar:
  renderer: musetalk           # musetalk | latentsync | none
  venv: "~/envs/musetalk"
  base_loop: "assets/avatar/base_loop.mp4"
  fps: 25
  bbox_shift: 0                # nudge the mouth region if lips read too closed
  chunk_seconds: 120

video:
  width: 1920
  height: 1080
  fps: 25
  encoder: h264_nvenc          # Ampere has no AV1 encode; H.264 is the right pick
  preset: p5
  cq: 21
  background: "assets/brand/background.png"
  intro: "assets/brand/intro.mp4"
  outro: "assets/brand/outro.mp4"
  burn_captions: true
  # Neutral slate. Every client overrides this with their own brand colour.
  accent: "#2F6F7E"
  caption_font: "DejaVu Sans"
  caption_highlight: "3BE8FF"

audio:
  podcast_lufs: -16.0          # Apple/Spotify guidance for mono spoken word
  youtube_lufs: -14.0
  true_peak: -1.5
  loudness_range: 7.0
  music_bed: ""
  music_gain_db: -26.0

publish:
  youtube_enabled: false
  # Credentials are per client: a shared token would upload every show to one
  # YouTube channel.
  youtube_client_secrets: "config/youtube_client_secret.json"
  youtube_token: "config/youtube_token.json"
  youtube_privacy: "private"
  youtube_category_id: "25"    # News & Politics
  rss_enabled: true
  rss_output: "output/feed.xml"
  # Set per client. Never ship a real domain in the base config — a feed
  # published under the wrong host is hard to unwind once podcast directories
  # have cached it.
  site_base_url: "https://${SHOW_DOMAIN}"
  media_base_url: "https://media.${SHOW_DOMAIN}/episodes"
  archive_dir: ""

work_dir: "work"
output_dir: "output"
