# Cluster topology. Set `enabled: false` at the top to run everything on one box.
#
# Every worker container mounts the shared Unraid export at /pipeline, whatever
# its path is on the host. That means a job payload can name a file and every
# node resolves it to the same bytes.
#
# Card inventory, 2026-08-15:
#   node-a  10.10.5.15  1x RTX 3090                     (shared with Ollama)
#   node-b  10.10.5.16  1x RTX 3090 + 1x RTX A1000
#   node-c  10.10.5.17  1x RTX 3090 + 1x RTX A1000
#
# Both A1000s live on Threadripper boards now. Neither is on a riser.

enabled: true

storage:
  # Where the orchestrator sees the share. On node-a (10.10.5.15) this is the
  # Unraid share itself; the orchestrator container mounts it at /pipeline too,
  # so in practice these match.
  local_root: "/pipeline"
  # The path every worker container sees. Do not change without updating the
  # compose files -- this is the contract that makes paths portable.
  container_root: "/pipeline"
  # Node-local scratch inside each worker, for things that must never touch the
  # network: driving video, per-job temp files. Backed by local NVMe, not the array.
  scratch: "/scratch"

nodes:
  # Voice lives on node-a's 3090, the only card left in that box and the only
  # full-width slot on its board (a BIOSTAR TB250-BTC+ mining board with a
  # 4-core i7-7700). Ollama shares this card and holds ~17 GB with a 27B model
  # resident, against 24 GB total; OLLAMA_KEEP_ALIVE must stay short or this
  # worker cannot get its 6 GB and refuses to start.
  #
  # Measured 1.42x realtime across a 32-chunk episode -- 173 s of GPU time for
  # 4.1 min of audio. That is better than the 1.19x a single 8-second probe
  # suggested, because model warm-up amortizes over the batch. An 18-minute show
  # is therefore ~13 min of synthesis on this one card.
  tts-a:
    url: "http://10.10.5.15:8080"
    role: tts
    gpu: "RTX 3090 (node-a, shared with Ollama)"
    max_concurrent: 1

  # Avatar is the longest stage, so it gets the dedicated 3090s. Both are Gen3
  # x16 on Threadripper boards, unlike anything node-a can offer.
  avatar-b:
    url: "http://10.10.5.16:8081"
    role: avatar
    gpu: "RTX 3090 (node-b, dedicated)"
    max_concurrent: 1

  avatar-c:
    url: "http://10.10.5.17:8081"
    role: avatar
    gpu: "RTX 3090 (node-c, dedicated)"
    max_concurrent: 1

  # Captions and NVENC on the A1000s. These used to be one card in node-a's x1
  # chipset slot behind a USB riser, trained at Gen1 x1 -- about 250 MB/s, a
  # thirty-second of what the card can do. That was survivable for Whisper
  # (loads once, small audio in, text out) and would have been painful for
  # encode, which pushes real frame data across the bus. On the Threadripper
  # boards both cards get proper lanes, so encode belongs here now too.
  #
  # Two media workers is not about one episode being faster -- captions and
  # encode never overlap within an episode. It is about running two clients at
  # once without either waiting on the other.
  media-b:
    url: "http://10.10.5.16:8082"
    role: media
    gpu: "RTX A1000 (node-b)"
    max_concurrent: 1

  media-c:
    url: "http://10.10.5.17:8082"
    role: media
    gpu: "RTX A1000 (node-c)"
    max_concurrent: 1

  # The NEXT card should be a 3090 for a second TTS worker, and it should go in
  # node-b or node-c -- not another A1000, and not a third avatar.
  #
  # Voice now measures 1.42x realtime on one card: ~13 min for an 18-minute
  # episode, against ~20 min of avatar across the two existing workers. Those
  # are close enough that a third avatar worker would drop avatar to ~13 min and
  # make voice the new bottleneck, buying nothing. A second TTS card takes voice
  # to ~6 min and leaves avatar as the honest limit.
  #
  # An A1000 is the wrong card for this: 8 GB is tight against Chatterbox's
  # 6 GB floor, and it runs 4-6x slower than a 3090 even when it fits.
  # tts-c:
  #   url: "http://10.10.5.17:8080"
  #   role: tts
  #   gpu: "RTX 3090 (node-c, second card)"
  #   max_concurrent: 1

scheduling:
  # Seconds of audio per avatar render window. Larger amortizes per-render
  # warm-up; smaller starts the avatar sooner and spreads work across more
  # workers. 120 suits two avatar nodes -- a 20-minute episode becomes 10
  # windows, five per worker, which is enough granularity to keep both busy
  # without paying warm-up too often. Drop toward 90 at three avatar workers.
  window_seconds: 120

  # How long to wait for a busy node before giving up.
  max_wait_seconds: 900

  # Attempts per job. A second attempt lands on a different node when one is
  # available, which covers a worker that died mid-episode. Now that both the
  # avatar and media roles have two nodes, every stage except voice survives
  # losing a machine.
  attempts: 2

  # Consecutive failures before a node is marked unhealthy and skipped.
  max_failures: 3

health:
  # Probe every node before starting an episode. Cheap, and it turns "the render
  # silently never started" into "node-b is down".
  check_before_run: true
  timeout_seconds: 5
