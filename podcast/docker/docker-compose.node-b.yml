# node-b — 10.10.5.16 — 1x RTX 3090 + 1x RTX A1000 — Unraid
#
# Avatar worker on the 3090, media worker (captions + NVENC) on the A1000.
#
# The A1000 arrived here from node-a on 2026-08-15. Its UUID did not change --
# UUIDs are burned into the card, not the slot -- so the value that used to be
# NODE_A_A1000 is now NODE_B_A1000, verbatim. What did change is the bus: it was
# in an x1 chipset slot behind a USB riser on node-a, training at Gen1 x1
# (~250 MB/s). Here it gets real lanes, which is what makes it reasonable to run
# encode on it and not just Whisper.
#
# The share lives on node-a and is mounted here over NFS. On the Unraid host:
#   mkdir -p /mnt/remotes/podcast
#   mount -t nfs -o rw,soft,timeo=100,retrans=3,rsize=131072,wsize=131072 \
#         10.10.5.15:/mnt/user/podcast /mnt/remotes/podcast
#
# Inside every container it appears at /pipeline, the same path every other node
# uses -- that is what makes job payloads portable across nodes.
#
# Scratch pools this file expects (create them before first start):
#   mkdir -p /mnt/cache/podcast-scratch /mnt/cache/podcast-scratch-media
#
# Deploy:
#   cd /mnt/remotes/podcast/repo/podcast/docker
#   docker compose -f docker-compose.node-b.yml up -d --build

x-common: &common
  restart: unless-stopped
  runtime: nvidia
  # Reap zombies. Both workers shell out per job; without an init process those
  # children accumulate as defunct entries.
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:

  avatar-worker:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.avatar
    container_name: podcast-avatar
    ports: ["8081:8081"]
    mem_limit: 16g
    environment:
      NVIDIA_VISIBLE_DEVICES: "${NODE_B_3090}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,video"
      REQUIRED_VRAM_MB: "8000"
      LOCAL_CACHE: "/scratch"
      MUSETALK_HOME: "/opt/MuseTalk"
      # Disables the TorchScript compiler, without which `import mmcv.ops`
      # segfaults this image outright:
      #
      #   mmcv.ops.carafe -> mmengine.model -> mmengine zero_optimizer
      #     -> torch.distributed.optim -> functional_adadelta @torch.jit.script
      #     -> three levels of recursive compilation -> SIGSEGV
      #
      # mmcv 2.1.0 was built against torch ~2.1 and Dockerfile.avatar pins
      # nothing, so it landed on torch 2.6. Nothing on MuseTalk's inference path
      # uses TorchScript -- every weight it loads is a plain state dict -- so
      # turning the compiler off costs nothing and skips the import that dies.
      #
      # Remove this once Dockerfile.avatar pins the tested version set.
      PYTORCH_JIT: "0"
      # The second half of the same torch-2.6 mismatch. 2.6 flipped
      # torch.load's `weights_only` default to True, and mmengine's checkpoint
      # loader calls torch.load with no arguments -- so every mmpose/mmdet
      # checkpoint (they carry pickled meta alongside the tensors) now refuses
      # to load. These weights are ones we fetched ourselves from known repos,
      # not untrusted input, which is what the flag is guarding against.
      TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"
      PORT: "8081"
    volumes:
      # Worker source from the checkout rather than the copy baked in at build
      # time. This matters most here: the avatar image is 8.7 GB and pinned to a
      # version set that took several failed attempts to land, so "rebuild to
      # ship a one-line fix" is a genuinely risky operation. With this mount,
      # avatar_worker.py changes need only `git pull` on node-a and a restart.
      #
      # Read-only, so the container can never dirty the checkout.
      - /mnt/remotes/podcast/repo/podcast/cluster:/opt/worker:ro
      - /mnt/remotes/podcast:/pipeline
      # Node-local NVMe. Driving video lives here so it never crosses the
      # network. Must be a cache pool, not the parity array.
      - /mnt/cache/podcast-scratch:/scratch
      # 9.3 GB of weights, fetched by scripts/fetch_musetalk_weights.py. Per
      # node -- they are not on the share, deliberately, so a render never waits
      # on NFS to page in a model.
      - /mnt/user/appdata/podcast/musetalk-models:/opt/MuseTalk/models
    healthcheck:
      test: ["CMD", "python3.11", "-c",
             "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8081/health'))['model_loaded'] else 1)"]
      interval: 30s
      timeout: 10s
      # MuseTalk takes 60-90s to load. A shorter window would restart-loop the
      # container before it ever finishes starting.
      start_period: 300s
      retries: 3

  media-worker:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.media
    container_name: podcast-media
    ports: ["8082:8082"]
    mem_limit: 8g
    environment:
      # The A1000. Deliberately a different card from the avatar worker, so
      # captions and encoding never queue behind a render.
      NVIDIA_VISIBLE_DEVICES: "${NODE_B_A1000}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,video"
      REQUIRED_VRAM_MB: "2500"
      WHISPER_MODEL: "large-v3"
      WHISPER_COMPUTE: "int8_float16"
      PORT: "8082"
    volumes:
      # Worker source from the checkout, not the baked copy -- `git pull` on
      # node-a plus a restart ships a change here.
      - /mnt/remotes/podcast/repo/podcast/cluster:/opt/worker:ro
      - /mnt/remotes/podcast:/pipeline
      - /mnt/cache/podcast-scratch-media:/scratch
      # ~3 GB of Whisper weights, downloaded on first start. node-c holds its
      # own copy; that is the cost of two media workers and it is worth it.
      - /mnt/user/appdata/podcast/whisper-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3.11", "-c",
             "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8082/health'))['model_loaded'] else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
