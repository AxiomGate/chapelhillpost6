# node-c — 10.10.5.17 — AxiomGateThreadRipper2 — 1x RTX 3090 + 1x RTX A1000 — Unraid
#
# Avatar worker on the 3090, media worker (captions + NVENC) on the A1000.
# Identical in shape to node-b; only the UUIDs differ.
#
# Threadripper 1900X, 8c/16t, 31 GB. The 3090 sits at Gen3 x16 and the A1000 got
# real lanes here too -- both better than anything node-a can offer.
#
# The share lives on node-a and is mounted here over NFS at /mnt/remotes/podcast.
# Inside the containers it appears at /pipeline, the same path every other node
# uses -- that is what makes job payloads portable across nodes.
#
# Scratch pools this file expects (create them before first start):
#   mkdir -p /mnt/cache/podcast-scratch /mnt/cache/podcast-scratch-media
#
# Deploy:
#   cd /mnt/remotes/podcast/repo/podcast/docker
#   docker compose -f docker-compose.node-c.yml up -d --build

x-common: &common
  restart: unless-stopped
  runtime: nvidia
  # Reap zombies. Both workers shell out per job; without an init process those
  # children accumulate as defunct entries.
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:

  avatar-worker:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.avatar
    container_name: podcast-avatar
    ports: ["8081:8081"]
    # A ceiling so a runaway render degrades this container instead of the host.
    # 31 GB box; MuseTalk plus torch sits well under this in normal operation.
    mem_limit: 16g
    environment:
      NVIDIA_VISIBLE_DEVICES: "${NODE_C_3090}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,video"
      REQUIRED_VRAM_MB: "8000"
      LOCAL_CACHE: "/scratch"
      MUSETALK_HOME: "/opt/MuseTalk"
      # See docker-compose.node-b.yml for the full reasoning: `import mmcv.ops`
      # segfaults on torch 2.6 while compiling torch.distributed.optim with
      # TorchScript. MuseTalk's inference path never uses TorchScript, so
      # disabling the compiler skips the fatal import at no cost.
      PYTORCH_JIT: "0"
      # torch 2.6 flipped torch.load's `weights_only` default to True and
      # mmengine's checkpoint loader passes no argument, so DWPose and the other
      # mm* checkpoints refuse to load. See node-b for the full note.
      TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"
      PORT: "8081"
    volumes:
      # node-a's share over NFS. Same in-container path as every other node.
      # Worker source from the checkout rather than the copy baked in at build
      # time. This matters most here: the avatar image is 8.7 GB and pinned to a
      # version set that took several failed attempts to land, so "rebuild to
      # ship a one-line fix" is a genuinely risky operation. With this mount,
      # avatar_worker.py changes need only `git pull` on node-a and a restart.
      #
      # Read-only, so the container can never dirty the checkout.
      - /mnt/remotes/podcast/repo/podcast/cluster:/opt/worker:ro
      - /mnt/remotes/podcast:/pipeline
      # Node-local NVMe. Driving video lives here so it never crosses the
      # network. Must be a cache pool, not the parity array.
      - /mnt/cache/podcast-scratch:/scratch
      # 9.3 GB of weights, fetched by scripts/fetch_musetalk_weights.py.
      - /mnt/user/appdata/podcast/musetalk-models:/opt/MuseTalk/models
    healthcheck:
      test: ["CMD", "python3.11", "-c",
             "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8081/health'))['model_loaded'] else 1)"]
      interval: 30s
      timeout: 10s
      # MuseTalk takes 60-90s to load. A shorter window would restart-loop the
      # container before it ever finishes starting.
      start_period: 300s
      retries: 3

  media-worker:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.media
    container_name: podcast-media
    ports: ["8082:8082"]
    mem_limit: 8g
    environment:
      # The second A1000, installed 2026-08-15. This is a new card, so its UUID
      # is not one you already had -- look it up on this host.
      NVIDIA_VISIBLE_DEVICES: "${NODE_C_A1000}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,video"
      REQUIRED_VRAM_MB: "2500"
      WHISPER_MODEL: "large-v3"
      WHISPER_COMPUTE: "int8_float16"
      PORT: "8082"
    volumes:
      # Worker source from the checkout, not the baked copy -- `git pull` on
      # node-a plus a restart ships a change here.
      - /mnt/remotes/podcast/repo/podcast/cluster:/opt/worker:ro
      - /mnt/remotes/podcast:/pipeline
      - /mnt/cache/podcast-scratch-media:/scratch
      # ~3 GB of Whisper weights, downloaded on first start. Separate from
      # node-b's copy; each media worker holds its own.
      - /mnt/user/appdata/podcast/whisper-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3.11", "-c",
             "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8082/health'))['model_loaded'] else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
