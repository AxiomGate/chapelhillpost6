# node-a — 10.10.5.15 — 1x RTX 3090 — Unraid
#
# Hosts the shared export, the orchestrator and the voice worker.
#
# The A1000 that used to sit here has moved to node-b. Good riddance: on this
# board its only home was an x1 chipset slot behind a USB riser, where it trained
# at Gen1 x1. This box is now single-card, which also takes pressure off a
# 4-core i7-7700 on a BIOSTAR TB250-BTC+ mining board -- the weakest machine in
# the cluster and the one that fell over on 2026-08-13.
#
# GPU selection uses UUIDs, not indices. Indices reorder across reboots and after
# any hardware change; a UUID is burned into the card and follows it between
# machines. Values come from podcast/.env -- see .env.example. Get them with:
#   nvidia-smi --query-gpu=index,name,uuid,memory.total --format=csv
#
# Deploy:
#   cd /mnt/user/podcast/repo/podcast/docker
#   docker compose -f docker-compose.node-a.yml up -d --build

x-common: &common
  restart: unless-stopped
  runtime: nvidia
  networks: [podcast]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:

  tts-worker:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.tts
    container_name: podcast-tts
    ports: ["8080:8080"]
    # Reap zombies from the per-job subprocesses.
    init: true
    # A ceiling, so a runaway job degrades this container instead of the host.
    # Node-a has 31 GB and no swap: without a limit, memory pressure here has no
    # reclaim path except evicting page cache, and the box thrashes at 90% iowait
    # without the OOM killer ever firing. That is exactly what took it down.
    mem_limit: 8g
    environment:
      NVIDIA_VISIBLE_DEVICES: "${NODE_A_3090}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      # Ollama shares this card and holds ~17 GB of a 27B model. If it has not
      # released, this worker refuses to start with a specific message rather
      # than dying mid-episode. Keep OLLAMA_KEEP_ALIVE short.
      REQUIRED_VRAM_MB: "6000"
      TTS_SEED: "1234"
      PORT: "8080"
    volumes:
      - /mnt/user/podcast:/pipeline
      - /mnt/cache/podcast-scratch:/scratch
      - /mnt/user/appdata/podcast/chatterbox-models:/root/.cache/huggingface
    healthcheck:
      # python3.11, not python. These images install python3.11 with no `python`
      # symlink, so a `python` healthcheck fails on a container that is fine.
      test: ["CMD", "python3.11", "-c",
             "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8080/health'))['model_loaded'] else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 3

  orchestrator:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestrator
    container_name: podcast-orchestrator
    # CPU only. It coordinates and serves the review page; it runs no models.
    runtime: runc
    ports:
      # Review UI, reachable from any machine on the LAN. Published on 8421
      # because node-a already runs another container on 8420; the app still
      # binds 8420 inside the container. A port collision here does not fail
      # loudly -- the container sits in `Created`, or starts with no published
      # port at all, and the UI is simply unreachable.
      - "8421:8420"
    environment:
      # Everything else is derived from this one path: clients/, work/ and
      # output/ are found beside its parent, and cluster.yaml is read from the
      # same config directory. The image ships only code -- without this the
      # orchestrator looks inside the container and finds nothing.
      PODCASTPIPE_CONFIG: "/pipeline/config/show.yaml"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      TZ: "America/New_York"
    volumes:
      - /mnt/user/podcast:/pipeline
    # Only the local worker. The avatar and media workers live on node-b and
    # node-c; the orchestrator reaches them over HTTP and health-checks them at
    # the start of a run, so there is nothing to depend on here.
    depends_on:
      - tts-worker

networks:
  podcast:
    driver: bridge
