[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcastpipe"
version = "0.1.0"
description = "Daily podcast video pipeline: research, script, voice, avatar, video, publish"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
# The review UI. Kept optional so the pipeline can run headless on a box that
# never serves a web page.
review = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]
# Caption alignment. Pulls CTranslate2, so it is not a core dependency.
captions = [
    "faster-whisper>=1.0",
]
# YouTube upload.
publish = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
podcastpipe = "podcastpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
