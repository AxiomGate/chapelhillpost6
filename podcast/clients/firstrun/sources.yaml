# Feeds for this client only. Nothing here is shared with other clients.
#
# Publishers move and retire feeds constantly, and a dead feed fails quietly —
# research just returns fewer stories. Check this list with:
#
#   podcastpipe --client firstrun feeds
#
# It reports per-feed item counts and exits non-zero if anything is broken. Ten
# working feeds beat thirty half-working ones, and a show that silently lost half
# its sources looks like a show with nothing to say.
#
# Note that "unreadable feed" is not proof a URL is dead. Several publishers here
# answer non-browser requests with an HTML challenge page, which the XML parser
# reports as a syntax error; the fetcher sends a browser user-agent for exactly
# that reason. Confirm with `feeds` before replacing a URL.
#
# `weight` multiplies a story's relevance score, so it expresses "this source
# outranks that one" without hand-editing results every morning.

feeds:
  # --- Benefits and VA policy: the spine of this show -------------------
  - name: "VA News"
    url: "https://news.va.gov/feed/"
    weight: 1.3
  # Military.com retired its per-category feeds -- /rss/benefits and /rss/news
  # both 404, and their own RSS page now advertises exactly one feed for the
  # whole site. So this is broader than the two entries it replaces, and the
  # keyword weights below are what pull the benefits and legislation stories out
  # of it.
  - name: "Military.com"
    url: "https://www.military.com/feed/"
    weight: 1.2

  # --- Service and Pentagon reporting ------------------------------------
  - name: "Military Times"
    url: "https://www.militarytimes.com/arc/outboundfeeds/rss/?outputType=xml"
    weight: 1.1
  # Stripes serves feeds from subscribe.stripes.com, not the main site. Their
  # veterans feed is exactly this show's beat, so it outranks the general one.
  - name: "Stars and Stripes — Veterans"
    url: "https://subscribe.stripes.com/rss/veterans.xml"
    weight: 1.3
  - name: "Stars and Stripes"
    url: "https://subscribe.stripes.com/rss/top-news.xml"
    weight: 1.0
  - name: "Task & Purpose"
    url: "https://taskandpurpose.com/feed/"
    weight: 1.0
  - name: "Defense News"
    url: "https://www.defensenews.com/arc/outboundfeeds/rss/?outputType=xml"
    weight: 0.9
  - name: "DoD News"
    url: "https://www.defense.gov/DesktopModules/ArticleCS/RSS.ashx?ContentType=1&Site=945&max=20"
    weight: 0.9

  # --- Accountability and investigations ---------------------------------
  # Slower moving and lower volume, but this is where the deep-dive stories
  # actually come from. Weighted up because one good item beats ten routine ones.
  - name: "The War Horse"
    url: "https://thewarhorse.org/feed/"
    weight: 1.2
  # VA Office of Inspector General — DISABLED, no working URL found yet.
  #
  # vaoig.gov/rss/reports.xml and va.gov/oig/rss/reports.xml both 404, and
  # va.gov/oig/rss/ answers 200 with no feed links in it at all. Guessing a
  # third URL has cost two rounds already, so this stays off until one is
  # confirmed by fetching it rather than by reasoning about it.
  #
  # Worth restoring when found: OIG reports are low-volume and are where the
  # deep-dive stories actually come from. Their absence is why The Long Look is
  # currently drawn from the same news feeds as The Rundown.
  # - name: "VA Office of Inspector General"
  #   url: "?"
  #   weight: 1.2

# Keyword weights drive relevance scoring. A hit in the headline counts double a
# hit in the body, so a term in a headline strongly implies the story is about it.
#
# Weighted toward things that CHANGE — rules, deadlines, rates, rulings — because
# the style guide says an item without a change is not a story.
keywords:
  # Benefits and money
  "PACT Act": 3.0
  "presumptive": 2.5
  "disability rating": 2.5
  "disability claim": 2.5
  "GI Bill": 2.5
  "TRICARE": 2.5
  "cost-of-living": 2.0
  "COLA": 2.0
  "backlog": 2.0
  "burn pit": 2.0
  "toxic exposure": 2.0
  "housing allowance": 1.8
  "survivor benefit": 1.8
  "pension": 1.5

  # Health
  "veteran suicide": 2.5
  "mental health": 1.8
  "community care": 1.8
  "VA hospital": 1.5
  "wait time": 1.5

  # Policy mechanics — the words that signal something actually moved
  "final rule": 2.5
  "effective date": 2.2
  "deadline": 2.2
  "signed into law": 2.2
  "takes effect": 2.0
  "court ruled": 2.0
  "NDAA": 2.0
  "appropriations": 1.5

  # Force and service
  "National Guard": 1.5
  "reservist": 1.5
  "recruiting": 1.3
  "deployment": 1.3
  "transition assistance": 1.8

  # Down-weight the ceremonial coverage this beat is flooded with. The style
  # guide rules it out; scoring it down keeps it out of the brief entirely.
  "ceremony": -2.0
  "ribbon cutting": -2.5
  "commemorat": -1.5
  "honor flight": -1.5
  "appointed": -1.0
